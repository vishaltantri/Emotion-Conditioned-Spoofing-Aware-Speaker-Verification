name: tests

# The suite is deliberately corpus-free: every test runs on fixtures built in
# code, so CI needs no download, no GPU, no network and no audio toolchain
# (the producers that read audio are exercised by hand, not here).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Tests
        run: python -m pytest -q
      - name: CLI help paths
        run: |
          python -m easv.cli --help
          python -m easv.cli evaluate --help
