# Template for a real evaluation; NOT used by the reported runs, which use
# configs/real_run.yaml. Keep it for a fresh corpus or a new benchmark.
#
# Fill in the split names used by your manifest, confirm dataset licences, and
# lock the protocol (docs/PROTOCOL.md) before looking at test metrics. The
# provenance note is a required field: a run without dataset version, licence and
# emotion-label provenance cannot be cited.
seed: 7

splits:
  train: train     # fusion fitting
  dev: dev         # threshold selection and model selection
  test: test       # reported once

models:
  - speaker_only
  - linear
  - emotion_additive
  - emotion_interaction
  - emotion_gated

training:
  l2: 0.003
  max_iter: 3000
  use_uncertainty: true
  gated:
    hidden: 4
    lr: 0.03
    epochs: 2500
    patience: 300
    validation_fraction: 0.15
    early_stopping: true

# Choose the operating point *before* evaluation. `target_far` is closer to a
# deployment constraint; `eer` is the conventional reporting point.
threshold:
  policy: eer
  far_target: 0.01

metrics:
  tdcf_version: "2021"

bootstrap:
  n_resamples: 1000
  seed: 7
  level: 0.95

report:
  breakdown_by: [emotion, attack]
  baseline_model: linear

provenance:
  kind: real
  # Fill this in; the placeholder is deliberate and must not survive into a
  # reported run (the executed runs record theirs in configs/real_run.yaml).
  note: "TODO: record dataset versions, licences, and how emotion labels were obtained."
