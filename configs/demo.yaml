# Synthetic pipeline demonstration. Numbers reported from this config validate
# the code path only; they carry no scientific claim about real speech.
seed: 7

splits:
  train: train
  dev: dev
  test: test

models:
  - speaker_only
  - linear
  - emotion_additive
  - emotion_interaction
  - emotion_gated

training:
  l2: 0.003
  max_iter: 3000
  use_uncertainty: true
  gated:
    hidden: 4
    lr: 0.03
    epochs: 2500
    patience: 300
    validation_fraction: 0.15
    early_stopping: true

threshold:
  policy: eer

metrics:
  tdcf_version: "2021"

bootstrap:
  n_resamples: 300
  seed: 7
  level: 0.95

report:
  breakdown_by: [emotion, attack]
  baseline_model: linear

provenance:
  kind: synthetic
  note: "Simulated scores generated by easv.demo. Pipeline validation only."
