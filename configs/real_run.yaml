# Real-data evaluation: ESD English bona fide + EmoSpoof-TTS clones.
#
# Frozen before the first test-split report; changing a hyperparameter after
# seeing test numbers invalidates the comparison. Two of the five arms are
# required ablations (no-emotion, and capacity control).
seed: 7

splits:
  train: train     # fusion fitting only
  dev: dev         # threshold + model selection only
  test: test       # reported once

models:
  - speaker_only
  - linear
  - emotion_additive
  - emotion_interaction
  - emotion_gated

training:
  l2: 0.003
  max_iter: 3000
  use_uncertainty: true
  gated:
    hidden: 4
    lr: 0.03
    epochs: 2500
    patience: 300
    validation_fraction: 0.15
    early_stopping: true

threshold:
  policy: eer

metrics:
  tdcf_version: "2021"

bootstrap:
  n_resamples: 1000
  seed: 7
  level: 0.95

report:
  breakdown_by: [emotion, attack]
  baseline_model: linear

provenance:
  kind: real
  note: >-
    ESD English speakers 0011-0020 (bona fide, emotion ground truth from the
    corpus folders) + EmoSpoof-TTS StyleTTS2, F5-TTS and CosyVoice subsets
    (spoof, emotion ground truth from the generator archives; 12,000 wavs per
    generator, 36,000 clones). Speaker split 4/2/4, 53,900 trials. ASV scores
    from SpeechBrain ECAPA-TDNN, SER from wav2vec2-base-superb-er. The CM in the
    reported run is the cross-generator arm: a log-mel CNN trained with the
    StyleTTS2 generator excluded from training and from dev-based early stopping
    (SPF-EER 1.60 % overall, 2.50 % on the unseen StyleTTS2 clones). Other runs
    swap only the CM file (in-domain CNN, LA-pretrained AASIST, LA-retrained
    AASIST); see docs/REAL_RESULTS.md for each regime.
